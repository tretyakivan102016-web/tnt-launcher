name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза для прикрепления APK (например v1.6.0); пусто — только артефакт'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # SDK уже предустановлен на ubuntu-latest (ANDROID_HOME + лицензии) — отдельная настройка не нужна
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          cp android/app/build/outputs/apk/release/app-release.apk "TnT-Launcher-${TAG#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tnt-launcher-android
          path: '*.apk'
      - uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: '*.apk'
