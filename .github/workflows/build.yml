name: Build and release
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Кодовая подпись: electron-builder сам подхватывает эти переменные.
      # Пока секреты не заданы — сборки проходят как раньше (без подписи).
      CSC_LINK: ${{ secrets.CSC_LINK }}                          # сертификат (.p12, base64) для Windows и/или macOS
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: false                          # без сертификата не искать ключи в ключнице CI
      APPLE_ID: ${{ secrets.APPLE_ID }}                           # нотаризация macOS (когда появится Apple Developer)
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:win
        if: matrix.os == 'windows-latest'
      - run: npm run dist:mac
        if: matrix.os == 'macos-latest'
      - run: npm run dist:linux
        if: matrix.os == 'ubuntu-latest'
      - uses: actions/upload-artifact@v4
        with:
          name: tnt-launcher-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
