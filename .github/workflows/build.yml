name: Build and release
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false                          # без сертификата не искать ключи в ключнице CI
    steps:
      - uses: actions/checkout@v4
      - name: Configure code signing (только если секреты заданы)
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}                # сертификат (.p12, base64) для Windows и/или macOS
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}                # нотаризация macOS (когда появится Apple Developer)
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "CSC_LINK=$CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Подпись включена: CSC_LINK задан"
          else
            echo "Секреты CSC_LINK нет — сборка без подписи, как обычно"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:win
        if: matrix.os == 'windows-latest'
      - run: npm run dist:mac
        if: matrix.os == 'macos-latest'
      - run: npm run dist:linux
        if: matrix.os == 'ubuntu-latest'
      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd dist
          ls -1 *.exe *.dmg *.AppImage *.deb 2>/dev/null | while read f; do sha256sum "$f"; done > "checksums-${{ matrix.os }}.txt" || true
          cat "checksums-${{ matrix.os }}.txt" || true
      - uses: actions/upload-artifact@v4
        with:
          name: tnt-launcher-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/checksums-*.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/checksums-*.txt
